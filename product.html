<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product — Sweet Rayne Cottage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header scrolled" id="site-header">
    <div class="container nav-inner">
      <a href="index.html" class="logo">Sweet Rayne Cottage</a>
      <nav class="main-nav" id="main-nav">
        <a href="shop.html">Shop</a>
        <a href="shop.html?cat=Dresses">Dresses</a>
        <a href="shop.html?cat=Tops">Tops</a>
        <a href="shop.html?cat=Bottoms">Bottoms</a>
        <a href="index.html#about">About</a>
        <a href="cart.html" class="nav-cart" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="22" height="22"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          <span class="cart-badge" style="display:none">0</span>
        </a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="page-main">
    <div class="container">
      <a href="shop.html" class="back-link">← Back to Shop</a>
      <div id="product-detail" class="product-detail">
        <!-- populated by JS -->
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <div class="container">
        <p>&copy; 2026 Sweet Rayne Cottage. <a href="index.html">Home</a> · <a href="shop.html">Shop</a> · <a href="cart.html">Cart</a></p>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script type="module">
    import { addToCart } from './js/cart.js';

    async function init() {
      const id = new URLSearchParams(location.search).get('id');
      const res = await fetch('products.json');
      const products = await res.json();
      const p = products.find(x => x.id === id);

      if (!p) {
        document.getElementById('product-detail').innerHTML = '<p class="not-found">Product not found. <a href="shop.html">Back to shop</a></p>';
        return;
      }

      document.title = `${p.name} — Sweet Rayne Cottage`;

      document.getElementById('product-detail').innerHTML = `
        <div class="product-detail-img" style="background:${p.gradient}">
          <span class="product-emoji product-emoji-lg">${p.emoji}</span>
          ${p.badge ? `<div class="product-badge">${p.badge}</div>` : ''}
        </div>
        <div class="product-detail-info">
          <span class="product-category">${p.category}</span>
          <h1>${p.name}</h1>
          <span class="product-detail-price">$${p.price.toFixed(2)}</span>
          <p class="product-detail-desc">${p.description}</p>

          <div class="selector-group">
            <label>Color</label>
            <div class="color-selector" id="color-selector">
              ${p.colors.map((c, i) => `
                <button class="color-btn${i === 0 ? ' selected' : ''}" data-color="${c}">${c}</button>
              `).join('')}
            </div>
          </div>

          <div class="selector-group">
            <label>Size</label>
            <div class="size-selector" id="size-selector">
              ${p.sizes.map((s, i) => `
                <button class="size-btn${i === 0 ? ' selected' : ''}" data-size="${s}">${s}</button>
              `).join('')}
            </div>
          </div>

          <div class="qty-row">
            <div class="qty-selector">
              <button id="qty-minus">−</button>
              <span id="qty-val">1</span>
              <button id="qty-plus">+</button>
            </div>
          </div>

          <button class="btn btn-primary btn-full" id="add-btn">Add to Cart</button>

          <div class="product-detail-meta">
            <p>🧵 Handmade in small batches</p>
            <p>📦 Ships within 3–5 business days</p>
            <p>💌 Questions? <a href="mailto:hello@sweetraynecottage.com">Email us</a></p>
          </div>
        </div>
      `;

      let selectedColor = p.colors[0];
      let selectedSize = p.sizes[0];
      let qty = 1;

      document.querySelectorAll('.color-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedColor = btn.dataset.color;
        });
      });

      document.querySelectorAll('.size-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedSize = btn.dataset.size;
        });
      });

      document.getElementById('qty-minus').addEventListener('click', () => {
        if (qty > 1) { qty--; document.getElementById('qty-val').textContent = qty; }
      });
      document.getElementById('qty-plus').addEventListener('click', () => {
        qty++; document.getElementById('qty-val').textContent = qty;
      });

      document.getElementById('add-btn').addEventListener('click', () => {
        addToCart(p, selectedSize, selectedColor, qty);
      });
    }

    init();
  </script>
</body>
</html>
