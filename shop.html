<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — Sweet Rayne Cottage</title>
  <meta name="description" content="Browse all handmade clothing from Sweet Rayne Cottage. Dresses, tops, bottoms and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header scrolled" id="site-header">
    <div class="container nav-inner">
      <a href="index.html" class="logo">Sweet Rayne Cottage</a>
      <nav class="main-nav" id="main-nav">
        <a href="shop.html">Shop</a>
        <a href="shop.html?cat=Dresses">Dresses</a>
        <a href="shop.html?cat=Tops">Tops</a>
        <a href="shop.html?cat=Bottoms">Bottoms</a>
        <a href="index.html#about">About</a>
        <a href="cart.html" class="nav-cart" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="22" height="22"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          <span class="cart-badge" style="display:none">0</span>
        </a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="page-main">
    <div class="container">
      <div class="shop-page-header">
        <h1 id="shop-title">The Collection</h1>
        <p id="shop-subtitle">Curated styles for every occasion — new arrivals added regularly.</p>
      </div>

      <!-- Filters -->
      <div class="filter-bar">
        <button class="filter-btn active" data-cat="">All</button>
        <button class="filter-btn" data-cat="Dresses">Dresses</button>
        <button class="filter-btn" data-cat="Tops">Tops</button>
        <button class="filter-btn" data-cat="Bottoms">Bottoms</button>
      </div>

      <div class="products-grid" id="shop-grid">
        <!-- populated by JS -->
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <div class="container">
        <p>&copy; 2026 Sweet Rayne Cottage. <a href="index.html">Home</a> · <a href="cart.html">Cart</a></p>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script type="module">
    import { addToCart } from './js/cart.js';

    let allProducts = [];

    async function init() {
      const res = await fetch('products.json');
      allProducts = await res.json();

      const params = new URLSearchParams(location.search);
      const cat = params.get('cat') || '';
      if (cat) {
        document.getElementById('shop-title').textContent = cat;
        document.getElementById('shop-subtitle').textContent = `Handmade ${cat.toLowerCase()} crafted with love.`;
        document.querySelector(`[data-cat="${cat}"]`)?.classList.add('active');
        document.querySelector('[data-cat=""]')?.classList.remove('active');
      }

      render(cat);

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          render(btn.dataset.cat);
          history.replaceState(null, '', btn.dataset.cat ? `?cat=${btn.dataset.cat}` : 'shop.html');
        });
      });
    }

    function render(cat) {
      const filtered = cat ? allProducts.filter(p => p.category === cat) : allProducts;
      const grid = document.getElementById('shop-grid');
      grid.innerHTML = filtered.map(p => `
        <article class="product-card fade-in">
          <a href="product.html?id=${p.id}" class="product-img-link">
            <div class="product-img" style="background:${p.gradient}">
              ${p.badge ? `<div class="product-badge">${p.badge}</div>` : ''}
              <span class="product-emoji">${p.emoji}</span>
            </div>
          </a>
          <div class="product-info">
            <span class="product-category">${p.category}</span>
            <h3><a href="product.html?id=${p.id}">${p.name}</a></h3>
            <p>${p.description}</p>
            <div class="product-footer">
              <span class="product-price">$${p.price.toFixed(2)}</span>
              <div class="product-actions">
                <a href="product.html?id=${p.id}" class="btn btn-sm">View</a>
                <button class="btn btn-sm btn-primary add-to-cart" data-id="${p.id}">Add</button>
              </div>
            </div>
          </div>
        </article>
      `).join('');

      // Trigger animations
      requestAnimationFrame(() => {
        grid.querySelectorAll('.fade-in').forEach((el, i) => {
          setTimeout(() => el.classList.add('visible'), i * 60);
        });
      });

      grid.querySelectorAll('.add-to-cart').forEach(btn => {
        btn.addEventListener('click', () => {
          const product = allProducts.find(p => p.id === btn.dataset.id);
          addToCart(product, product.sizes[2] || product.sizes[0], product.colors[0]);
        });
      });
    }

    init();
  </script>
</body>
</html>
