<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Cart — Sweet Rayne Cottage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header scrolled" id="site-header">
    <div class="container nav-inner">
      <a href="index.html" class="logo">Sweet Rayne Cottage</a>
      <nav class="main-nav" id="main-nav">
        <a href="shop.html">Shop</a>
        <a href="shop.html?cat=Dresses">Dresses</a>
        <a href="shop.html?cat=Tops">Tops</a>
        <a href="shop.html?cat=Bottoms">Bottoms</a>
        <a href="index.html#about">About</a>
        <a href="cart.html" class="nav-cart" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="22" height="22"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          <span class="cart-badge" style="display:none">0</span>
        </a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="page-main">
    <div class="container">
      <h1 class="page-title">My Cart</h1>
      <div class="cart-layout">
        <div id="cart-items" class="cart-items">
          <!-- populated by JS -->
        </div>
        <aside class="cart-summary" id="cart-summary" style="display:none">
          <h2>Order Summary</h2>
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotal">$0.00</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span>Calculated at checkout</span>
          </div>
          <div class="summary-row summary-total">
            <span>Estimated Total</span>
            <span id="total">$0.00</span>
          </div>
          <button class="btn btn-primary btn-full" id="checkout-btn">Checkout Securely</button>
          <p class="checkout-note">🔒 Secure checkout powered by Stripe</p>
          <a href="shop.html" class="continue-link">← Continue Shopping</a>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <div class="container">
        <p>&copy; 2026 Sweet Rayne Cottage. <a href="index.html">Home</a> · <a href="shop.html">Shop</a></p>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script type="module">
    import { getCart, removeFromCart, updateQuantity, cartTotal, saveCart } from './js/cart.js';

    function render() {
      const cart = getCart();
      const itemsEl = document.getElementById('cart-items');
      const summaryEl = document.getElementById('cart-summary');

      if (!cart.length) {
        itemsEl.innerHTML = `
          <div class="cart-empty">
            <div class="cart-empty-icon">🛍️</div>
            <h2>Your cart is empty</h2>
            <p>Looks like you haven't added anything yet.</p>
            <a href="shop.html" class="btn btn-primary">Shop the Collection</a>
          </div>`;
        summaryEl.style.display = 'none';
        return;
      }

      summaryEl.style.display = 'block';
      itemsEl.innerHTML = cart.map(item => `
        <div class="cart-item" data-key="${item.key}">
          <div class="cart-item-img" style="background:${item.gradient}">
            <span>${item.emoji}</span>
          </div>
          <div class="cart-item-info">
            <h3>${item.name}</h3>
            <p>${item.color} · Size ${item.size}</p>
            <p class="cart-item-price">$${item.price.toFixed(2)}</p>
          </div>
          <div class="cart-item-controls">
            <div class="qty-selector">
              <button class="qty-btn" data-key="${item.key}" data-delta="-1">−</button>
              <span>${item.quantity}</span>
              <button class="qty-btn" data-key="${item.key}" data-delta="1">+</button>
            </div>
            <button class="remove-btn" data-key="${item.key}">Remove</button>
          </div>
          <div class="cart-item-total">$${(item.price * item.quantity).toFixed(2)}</div>
        </div>
      `).join('');

      const sub = cartTotal();
      document.getElementById('subtotal').textContent = `$${sub.toFixed(2)}`;
      document.getElementById('total').textContent = `$${sub.toFixed(2)}`;

      document.querySelectorAll('.qty-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          updateQuantity(btn.dataset.key, parseInt(btn.dataset.delta));
          render();
        });
      });

      document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          removeFromCart(btn.dataset.key);
          render();
        });
      });
    }

    document.getElementById('checkout-btn').addEventListener('click', async () => {
      const btn = document.getElementById('checkout-btn');
      btn.textContent = 'Redirecting…';
      btn.disabled = true;

      try {
        const res = await fetch('/api/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: getCart() }),
        });
        const data = await res.json();
        if (data.url) {
          window.location.href = data.url;
        } else {
          throw new Error(data.error || 'Checkout failed');
        }
      } catch (err) {
        btn.textContent = 'Checkout Securely';
        btn.disabled = false;
        alert('Checkout is not available yet. Please check back soon!');
      }
    });

    render();
  </script>
</body>
</html>
